# The image: line is rewritten by CI on every push to the app's main branch.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogsphere-public
  labels: { app: blogsphere-public }
spec:
  replicas: 2
  selector:
    matchLabels: { app: blogsphere-public }
  template:
    metadata:
      labels: { app: blogsphere-public }
    spec:
      containers:
      - name: web
        image: ghcr.io/hiten-007/blogsphere-public:latest
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet: { path: /, port: 3000 }
          initialDelaySeconds: 30
          periodSeconds: 10
