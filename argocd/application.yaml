apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blogsphere
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Hiten-007/blogsphere-gitops.git
    targetRevision: main
    path: apps
    directory: { recurse: true }
  destination:
    server: https://kubernetes.default.svc
    namespace: blogsphere
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
